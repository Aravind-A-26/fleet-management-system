spring.application.name=Fleetline
server.address=${SERVER_ADDRESS:127.0.0.1}
server.port=${PORT:8080}
spring.datasource.url=${DB_URL:jdbc:h2:file:./data/fleet;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH}
spring.datasource.username=${DB_USER:sa}
spring.datasource.password=${DB_PASSWORD:}
spring.flyway.enabled=true
spring.jackson.serialization.write-dates-as-timestamps=false
server.error.include-message=never
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:true}
spring.h2.console.path=/database
spring.h2.console.settings.web-allow-others=false
spring.h2.console.settings.trace=false
